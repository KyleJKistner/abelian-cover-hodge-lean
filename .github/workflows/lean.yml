name: Lean audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and independently check the environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false
          leanchecker: true
      - name: Check the source and print theorem dependencies
        run: ./scripts/audit.sh
