name: Lean audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned exact-arithmetic dependencies
        run: |
          python3 -m venv .venv-audit
          .venv-audit/bin/python -m pip install -r requirements-audit.txt
      - name: Check source integrity and replay original and repair certificates
        run: |
          .venv-audit/bin/python scripts/replay_certificates.py
          cat build/audit/replay_manifest.json

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and independently check the environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
          leanchecker: true
      - name: Check the source and print theorem dependencies
        run: ./scripts/audit.sh
      - name: Check the environment with pinned nanoda
        timeout-minutes: 45
        run: ./scripts/run_nanoda.sh
